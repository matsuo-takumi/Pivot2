<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Start with dark background to prevent white flash */
            background: #1e1e1e;
        }

        #editor {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="editor"></div>

    <script src="vs/loader.js"></script>
    <script>
        let editor = null;

        require.config({ paths: { vs: 'vs' } });

        require(['vs/editor/editor.main', 'vs/basic-languages/monaco.contribution'], function () {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '',
                language: 'plaintext',
                theme: prefersDark ? 'vs-dark' : 'vs-light',
                automaticLayout: true,
                minimap: { enabled: true },
                lineNumbers: 'on',
                fontSize: 14,
                fontFamily: "'Cascadia Code', 'Consolas', monospace",
                scrollBeyondLastLine: false,
                wordWrap: 'off',
                tabSize: 4,
                insertSpaces: true,
                autoIndent: 'full',
                formatOnPaste: true,
                formatOnType: true,
                renderWhitespace: 'selection',
                bracketPairColorization: { enabled: true }
            });

            // Notify host that editor is ready
            window.chrome.webview.postMessage({ type: 'ready' });

            // Listen for content changes
            editor.onDidChangeModelContent(() => {
                window.chrome.webview.postMessage({
                    type: 'contentChanged',
                    content: editor.getValue()
                });
            });
        });

        // API for host
        window.monacoApi = {
            setContent: function (content) {
                if (editor) {
                    editor.setValue(content || '');
                }
            },
            getContent: function () {
                return editor ? editor.getValue() : '';
            },
            setLanguage: function (language) {
                if (editor) {
                    monaco.editor.setModelLanguage(editor.getModel(), language || 'plaintext');
                }
            },
            setTheme: function (theme) {
                if (editor) {
                    monaco.editor.setTheme(theme);
                }
            },
            defineTheme: function (themeName, themeData) {
                monaco.editor.defineTheme(themeName, themeData);
            },
            setReadOnly: function (isReadOnly) {
                if (editor) {
                    editor.updateOptions({ readOnly: isReadOnly });
                }
            }
        };
    </script>
</body>

</html>
